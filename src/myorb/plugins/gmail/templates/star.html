{# A message's star, as in Gmail: right of its date, pressed to star or unstar it. #}
<button type="button" class="email-star-btn{% if message.starred %} is-starred{% endif %}" hx-post="/email/{{ account.id }}/{{ thread_id }}/star/{{ message.id }}?starred={{ 'false' if message.starred else 'true' }}" hx-swap="outerHTML" aria-pressed="{{ 'true' if message.starred else 'false' }}" aria-label="Starred" title="{{ star_error or ('Starred' if message.starred else 'Not starred') }}" data-email-star><svg width="18" height="18" viewBox="0 0 24 24" fill="{{ 'currentColor' if message.starred else 'none' }}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
